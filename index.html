<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Indonesia Pro</title>

    <!-- Memuat Font Google (Roboto, standar Material Design / Google) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Google Material Symbols (Ikon yang sama dengan Google Maps) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        'google-blue': '#1a73e8',
                        'google-gray': '#f1f3f4',
                    }
                }
            }
        }
    </script>

    <!-- Memuat Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #e5e3df; /* Warna latar belakang khas map saat loading */
        }
        
        #map { 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
        }

        /* Menghilangkan kontrol zoom bawaan */
        .leaflet-control-zoom { display: none !important; }
        .leaflet-control-attribution { 
            background: rgba(255,255,255,0.7) !important; 
            font-size: 10px !important;
        }

        /* Animasi untuk panel samping/bawah */
        .panel-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Efek Scrollbar tersembunyi */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Kustomisasi Marker (Pin) */
        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Ikon Google Maps Material Symbol */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Kontainer Peta Utama -->
    <div id="map"></div>

    <!-- Layar Loading -->
    <div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-google-gray border-t-google-blue mb-4"></div>
        <h1 class="text-lg font-medium text-slate-700">Memuat Peta Indonesia...</h1>
    </div>

    <!-- UI Overlay: Kotak Pencarian / Header (Kiri Atas) -->
    <div class="absolute top-4 left-4 right-4 md:right-auto md:w-[400px] z-[1000] flex flex-col gap-2">
        <div class="bg-white rounded-full shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex items-center px-4 py-3 cursor-pointer hover:shadow-lg transition-shadow" id="search-box">
            <span class="material-symbols-rounded text-slate-500 mr-3">menu</span>
            <input type="text" readonly value="Peta Interaktif Indonesia" class="flex-1 bg-transparent outline-none text-[15px] font-medium text-slate-700 cursor-pointer pointer-events-none">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-google-blue font-bold text-sm">
                ID
            </div>
        </div>
    </div>

    <!-- Panel Info Provinsi (Sidebar di Desktop, Bottom Sheet di Mobile) -->
    <div id="info-panel" class="absolute z-[1000] bg-white panel-transition shadow-[0_8px_24px_rgba(0,0,0,0.15)] 
        /* Mobile: Muncul dari bawah */
        bottom-0 left-0 right-0 rounded-t-3xl h-[65vh] translate-y-full
        /* Desktop: Muncul dari kiri */
        md:top-20 md:bottom-4 md:left-4 md:right-auto md:w-[400px] md:h-auto md:rounded-2xl md:-translate-x-[120%] md:translate-y-0
        flex flex-col overflow-hidden">
        
        <!-- Header Image Area (Foto Pemandangan) -->
        <div class="relative h-48 w-full bg-slate-200 shrink-0">
            <img id="prov-image" src="" alt="Pemandangan" class="w-full h-full object-cover">
            
            <!-- Tombol Tutup Panel -->
            <button id="close-panel" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm hover:bg-black/60 transition-colors">
                <span class="material-symbols-rounded text-sm">close</span>
            </button>
        </div>

        <!-- Area Konten (Scrollable) -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-5 pb-8">
            <h1 id="prov-name" class="text-2xl font-normal text-slate-900 mb-1">Nama Provinsi</h1>
            <p class="text-sm text-slate-500 mb-4 border-b border-slate-100 pb-4">Provinsi di Indonesia</p>

            <!-- Aksi Cepat (Tombol ala Google Maps) -->
            <div class="flex justify-around mb-6 border-b border-slate-100 pb-6">
                <button class="flex flex-col items-center gap-1.5 text-google-blue hover:text-blue-800 transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-blue-50 group-hover:bg-blue-100 flex items-center justify-center">
                        <span class="material-symbols-rounded icon-filled">directions</span>
                    </div>
                    <span class="text-[11px] font-medium">Rute</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 text-google-blue hover:text-blue-800 transition-colors group">
                    <div class="w-10 h-10 rounded-full border border-slate-200 group-hover:bg-slate-50 flex items-center justify-center">
                        <span class="material-symbols-rounded">bookmark</span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-700">Simpan</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 text-google-blue hover:text-blue-800 transition-colors group">
                    <div class="w-10 h-10 rounded-full border border-slate-200 group-hover:bg-slate-50 flex items-center justify-center">
                        <span class="material-symbols-rounded">share</span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-700">Bagikan</span>
                </button>
            </div>

            <!-- Detail Informasi -->
            <div class="space-y-4">
                <div class="flex items-start gap-4">
                    <span class="material-symbols-rounded text-slate-400 mt-0.5">location_city</span>
                    <div>
                        <p class="text-[13px] text-slate-500 font-medium">Ibu Kota</p>
                        <p id="prov-capital" class="text-[15px] text-slate-800 mt-0.5">-</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <span class="material-symbols-rounded text-slate-400 mt-0.5">group</span>
                    <div>
                        <p class="text-[13px] text-slate-500 font-medium">Populasi Penduduk</p>
                        <p id="prov-pop" class="text-[15px] text-slate-800 mt-0.5">-</p>
                    </div>
                </div>
                <div class="flex items-start gap-4">
                    <span class="material-symbols-rounded text-slate-400 mt-0.5">straighten</span>
                    <div>
                        <p class="text-[13px] text-slate-500 font-medium">Luas Wilayah</p>
                        <p id="prov-area" class="text-[15px] text-slate-800 mt-0.5">-</p>
                    </div>
                </div>
                <div class="flex items-start gap-4 pt-2">
                    <span class="material-symbols-rounded text-slate-400 mt-0.5">info</span>
                    <div>
                        <p class="text-[13px] text-slate-600 leading-relaxed">
                            Data ini merupakan simulasi interaktif. Klik area lain di peta untuk melihat detail provinsi lainnya.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Grup Tombol Aksi (Kanan Bawah) -->
    <div class="absolute bottom-6 right-4 z-[1000] flex flex-col gap-3">
        
        <!-- Toggle Tipe Peta (Satelit / Jalan) -->
        <button id="toggle-layer" class="w-12 h-12 bg-white rounded-lg shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex flex-col items-center justify-center hover:bg-slate-50 transition-colors group overflow-hidden relative">
            <img id="layer-thumbnail" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/4/8/12" class="absolute inset-0 w-full h-full object-cover opacity-80" alt="Layer">
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors"></div>
            <span class="material-symbols-rounded text-white z-10 drop-shadow-md">layers</span>
        </button>

        <!-- Tombol Lokasi Asal (Reset) -->
        <button id="reset-map" class="w-12 h-12 bg-white rounded-full shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex items-center justify-center text-slate-600 hover:text-google-blue hover:bg-slate-50 transition-colors">
            <span class="material-symbols-rounded icon-filled">my_location</span>
        </button>

        <!-- Grup Zoom -->
        <div class="bg-white rounded-lg shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden">
            <button id="zoom-in" class="w-12 h-12 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors border-b border-slate-200">
                <span class="material-symbols-rounded">add</span>
            </button>
            <button id="zoom-out" class="w-12 h-12 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors">
                <span class="material-symbols-rounded">remove</span>
            </button>
        </div>
    </div>

    <!-- Memuat Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        // 1. Konfigurasi Awal Peta
        const isMobile = window.innerWidth < 768;
        const initialCenter = [-2.5, 118.0]; // Titik tengah Indonesia
        const initialZoom = isMobile ? 4.5 : 5.5;

        const map = L.map('map', {
            zoomControl: false, // Dimatikan karena kita pakai tombol kustom
            minZoom: 4,
            maxZoom: 14,
            zoomAnimation: true
        }).setView(initialCenter, initialZoom);

        // 2. Definisi Peta Dasar (Basemaps) ala Google Maps
        // Peta Jalan (Mirip Google Maps Default)
        const streetLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        // Peta Satelit
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        // Tambahkan peta jalan sebagai default
        streetLayer.addTo(map);

        let currentLayer = 'street'; // Menyimpan status tipe peta yang aktif
        let geojsonLayer;
        let activeMarker = null; // Menyimpan pin lokasi yang sedang aktif

        // Data referensi (gabungan data asli & URL gambar Unsplash yang cantik)
        const provData = {
            "DKI JAKARTA": { capital: "Jakarta", pop: "10.56 Juta", area: "664 km²", imgId: "1555899434-112347314545" }, // Jakarta skyline
            "BALI": { capital: "Denpasar", pop: "4.32 Juta", area: "5,780 km²", imgId: "1537996194471-e657df975ab4" }, // Bali temple/rice terrace
            "PAPUA": { capital: "Jayapura", pop: "4.30 Juta", area: "319,036 km²", imgId: "1592398539201-382902b938c6" }, // Raja Ampat/Nature
            "JAWA BARAT": { capital: "Bandung", pop: "48.27 Juta", area: "35,377 km²", imgId: "1632059345091-b3b3a37f59d5" },
            "DI YOGYAKARTA": { capital: "Yogyakarta", pop: "3.88 Juta", area: "3,133 km²", imgId: "1588693156557-0a3791242337" }, // Borobudur/Prambanan vibe
            "JAWA TIMUR": { capital: "Surabaya", pop: "40.67 Juta", area: "47,800 km²", imgId: "1603565816030-6b389eeba8fa" }, // Bromo
            "SUMATERA BARAT": { capital: "Padang", pop: "5.53 Juta", area: "42,012 km²", imgId: "1587595431973-162d0d94add1" } // Rumah Gadang/Nature
        };

        // Fungsi utilitas hash
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
            return Math.abs(hash);
        }

        // Mengekstrak nama provinsi
        function getProvName(feature) {
            if (!feature || !feature.properties) return "Provinsi";
            return (feature.properties.Propinsi || feature.properties.NAME_1 || "Provinsi").toUpperCase();
        }

        // Mendapatkan data dan gambar provinsi
        function getEnrichedData(provName) {
            let data = provData[provName];
            
            // Generate data acak jika tidak ada di database statis
            if (!data) {
                const hash = hashString(provName);
                const words = provName.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1));
                
                // Kumpulan ID gambar pemandangan alam/kota Indonesia dari Unsplash untuk fallback
                const fallbackImages = ["1584314417721-a3f295b9d3e8", "1512100253150-128c77229e61", "1576402758129-8f430485600c", "1620023605206-8c4d2847fc72"];
                const imgId = fallbackImages[hash % fallbackImages.length];

                data = {
                    capital: "Kota " + words[0],
                    pop: (1 + (hash % 5)) + "." + (10 + (hash % 89)) + " Juta",
                    area: (10 + (hash % 90)) + "," + (100 + (hash % 899)) + " km²",
                    imgId: imgId
                };
            }
            
            // Format URL Unsplash
            data.imgUrl = `https://images.unsplash.com/photo-${data.imgId}?auto=format&fit=crop&w=600&q=80`;
            return data;
        }

        // Referensi Elemen DOM
        const infoPanel = document.getElementById('info-panel');
        const closePanelBtn = document.getElementById('close-panel');
        let selectedLayer = null; // Menyimpan polygon yang sedang dipilih

        function openPanel(provName) {
            const data = getEnrichedData(provName);
            
            // Update konten DOM
            document.getElementById('prov-name').innerText = provName;
            document.getElementById('prov-capital').innerText = data.capital;
            document.getElementById('prov-pop').innerText = data.pop;
            document.getElementById('prov-area').innerText = data.area;
            
            // Update gambar dengan fallback jika gagal dimuat
            const imgEl = document.getElementById('prov-image');
            imgEl.src = data.imgUrl;
            imgEl.onerror = () => {
                imgEl.src = `https://placehold.co/600x400/e2e8f0/64748b?text=${provName}`;
            };

            // Animasi masuk (menyesuaikan mobile/desktop)
            if (isMobile) {
                infoPanel.classList.remove('translate-y-full');
                infoPanel.classList.add('translate-y-0');
            } else {
                infoPanel.classList.remove('md:-translate-x-[120%]');
                infoPanel.classList.add('md:translate-x-0');
            }
        }

        function closePanel() {
            // Animasi keluar
            if (isMobile) {
                infoPanel.classList.remove('translate-y-0');
                infoPanel.classList.add('translate-y-full');
            } else {
                infoPanel.classList.remove('md:translate-x-0');
                infoPanel.classList.add('md:-translate-x-[120%]');
            }
            
            // Reset gaya polygon yang dipilih
            if (selectedLayer && geojsonLayer) {
                geojsonLayer.resetStyle(selectedLayer);
                selectedLayer = null;
            }

            // Hapus marker jika ada
            if (activeMarker) {
                map.removeLayer(activeMarker);
                activeMarker = null;
            }
        }

        closePanelBtn.addEventListener('click', closePanel);

        // Gaya default: Transparan, garis tipis (seperti mode peta biasa)
        function baseStyle() {
            return {
                fillColor: '#1a73e8', // Warna biru Google
                weight: 1,
                opacity: 0.4,
                color: '#666',
                fillOpacity: 0.0 // Sepenuhnya transparan sampai disorot
            };
        }

        function highlightFeature(e) {
            const layer = e.target;
            // Hanya highlight jika belum dipilih (diklik)
            if (selectedLayer !== layer) {
                layer.setStyle({
                    weight: 2,
                    color: '#1a73e8',
                    fillOpacity: 0.15
                });
                if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) layer.bringToFront();
                
                // Pastikan layer yang dipilih (jika ada) tetap paling depan
                if (selectedLayer) selectedLayer.bringToFront();
            }
        }

        function resetHighlight(e) {
            const layer = e.target;
            // Hanya reset jika bukan layer yang sedang dipilih
            if (selectedLayer !== layer) {
                geojsonLayer.resetStyle(layer);
            }
        }

        function zoomToFeature(e) {
            const layer = e.target;
            const provName = getProvName(layer.feature);
            
            // Reset layer sebelumnya
            if (selectedLayer && selectedLayer !== layer) {
                geojsonLayer.resetStyle(selectedLayer);
            }
            
            selectedLayer = layer;

            // Beri gaya tebal & isi biru pada layer yang dipilih (Khas pemilihan area Google Maps)
            layer.setStyle({
                weight: 3,
                color: '#1a73e8',
                fillColor: '#1a73e8',
                fillOpacity: 0.2
            });
            layer.bringToFront();

            // Dapatkan titik tengah untuk menaruh Pin
            const bounds = layer.getBounds();
            const center = bounds.getCenter();

            // Zoom peta ke area tersebut, dengan padding untuk panel
            map.flyToBounds(bounds, {
                paddingTopLeft: [isMobile ? 10 : 420, isMobile ? 10 : 20],
                paddingBottomRight: [isMobile ? 10 : 20, isMobile ? window.innerHeight * 0.6 : 20],
                maxZoom: 7,
                duration: 1.5 // Animasi mulus
            });

            // Hapus pin lama
            if (activeMarker) map.removeLayer(activeMarker);

            // Buat Ikon Pin ala Google Maps Merah
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<span class="material-symbols-rounded icon-filled text-[40px] text-red-600 drop-shadow-md" style="text-shadow: 0 4px 6px rgba(0,0,0,0.3);">location_on</span>`,
                iconSize: [40, 40],
                iconAnchor: [20, 40] // Titik bawah pin sejajar dengan koordinat
            });

            // Tambahkan Pin baru dengan sedikit delay agar selaras dengan animasi zoom
            setTimeout(() => {
                activeMarker = L.marker(center, { icon: customIcon }).addTo(map);
            }, 300);

            // Buka Panel
            openPanel(provName);
        }

        function onEachFeature(feature, layer) {
            // Hilangkan tooltip untuk tampilan yang lebih bersih, user bergantung pada klik
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: zoomToFeature
            });
        }

        // Event Listener untuk Tombol Kontrol
        document.getElementById('zoom-in').addEventListener('click', () => map.zoomIn());
        document.getElementById('zoom-out').addEventListener('click', () => map.zoomOut());
        
        document.getElementById('reset-map').addEventListener('click', () => {
            closePanel();
            map.flyTo(initialCenter, initialZoom, { duration: 1.5 });
        });

        // Toggle Layer (Jalan <-> Satelit)
        const toggleLayerBtn = document.getElementById('toggle-layer');
        const layerThumbnail = document.getElementById('layer-thumbnail');
        
        toggleLayerBtn.addEventListener('click', () => {
            if (currentLayer === 'street') {
                map.removeLayer(streetLayer);
                satelliteLayer.addTo(map);
                currentLayer = 'satellite';
                // Ubah thumbnail di tombol ke gambar map jalan
                layerThumbnail.src = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/4/8/12";
                
                // Jika satelit, ubah style polygon agar terlihat (garis putih)
                geojsonLayer.eachLayer(layer => {
                    if(layer !== selectedLayer) {
                        layer.setStyle({ color: '#ffffff', opacity: 0.6 });
                    }
                });
            } else {
                map.removeLayer(satelliteLayer);
                streetLayer.addTo(map);
                currentLayer = 'street';
                // Ubah thumbnail ke satelit
                layerThumbnail.src = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/4/8/12";
                
                // Kembalikan style default (garis abu)
                geojsonLayer.eachLayer(layer => {
                    if(layer !== selectedLayer) {
                        layer.setStyle({ color: '#666', opacity: 0.4 });
                    }
                });
            }
        });

        // Menyembunyikan panel jika klik area kosong di peta
        map.on('click', function(e) {
            // Logika Leaflet: Jika yang diklik adalah peta dasar (bukan polygon), tutup panel
            // Namun Leaflet mengeksekusi klik polygon dan map secara berurutan.
            // Fitur di bawah cukup aman karena stopPropagation tidak sepenuhnya diperlukan jika UI logic solid.
            closePanel();
        });

        // Muat Data GeoJSON
        async function initMapData() {
            const geojsonUrl = 'https://raw.githubusercontent.com/superpikar/indonesia-geojson/master/indonesia-province-simple.json';
            
            try {
                const response = await fetch(geojsonUrl);
                const data = await response.json();
                
                geojsonLayer = L.geoJSON(data, {
                    style: baseStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);

                // Hilangkan layar loading
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.classList.add('opacity-0');
                setTimeout(() => loadingScreen.remove(), 500);

            } catch (error) {
                console.error("Gagal memuat GeoJSON:", error);
                document.querySelector('#loading-screen h1').innerText = "Gagal memuat data spasial. Silakan muat ulang.";
                document.querySelector('#loading-screen h1').classList.add('text-red-500');
                document.querySelector('#loading-screen div').style.display = 'none';
            }
        }

        window.onload = initMapData;
    </script>
</body>
</html>
