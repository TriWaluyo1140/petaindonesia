<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Indonesia Pro - Pencarian Wilayah</title>

    <!-- Memuat Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        'google-blue': '#1a73e8',
                        'google-gray': '#f1f3f4',
                    }
                }
            }
        }
    </script>

    <!-- Memuat Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #e5e3df; 
        }
        
        #map { 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
        }

        .leaflet-control-zoom { display: none !important; }
        .leaflet-control-attribution { 
            background: rgba(255,255,255,0.7) !important; 
            font-size: 10px !important;
        }

        .panel-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Animasi loading pencarian */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1a73e8;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none; /* Sembunyikan secara default */
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased relative">

    <!-- Kontainer Peta Utama -->
    <div id="map"></div>

    <!-- UI Overlay: Kotak Pencarian -->
    <div class="absolute top-4 left-4 right-4 md:right-auto md:w-[400px] z-[1000] flex flex-col gap-2">
        <div class="bg-white rounded-2xl shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden transition-shadow focus-within:shadow-lg">
            <!-- Input Area -->
            <div class="flex items-center px-4 py-3 relative">
                <span id="search-icon" class="material-symbols-rounded text-slate-500 mr-3">search</span>
                <div id="search-loader" class="loader absolute left-4"></div>
                <input type="text" id="search-input" placeholder="Cari kelurahan, kecamatan, kota..." class="flex-1 bg-transparent outline-none text-[15px] font-medium text-slate-700 placeholder-slate-400">
                <button id="clear-search" class="hidden text-slate-400 hover:text-slate-600 ml-2">
                    <span class="material-symbols-rounded text-[20px]">close</span>
                </button>
            </div>
            
            <!-- Dropdown Hasil Pencarian -->
            <div id="search-results" class="max-h-[60vh] overflow-y-auto no-scrollbar hidden border-t border-slate-100">
                <!-- Item hasil akan disuntikkan ke sini melalui JS -->
            </div>
        </div>
    </div>

    <!-- Panel Info (Muncul setelah pencarian/klik) -->
    <div id="info-panel" class="absolute z-[1000] bg-white panel-transition shadow-[0_8px_24px_rgba(0,0,0,0.15)] 
        bottom-0 left-0 right-0 rounded-t-3xl h-[65vh] translate-y-full
        md:top-20 md:bottom-4 md:left-4 md:right-auto md:w-[400px] md:h-auto md:rounded-2xl md:-translate-x-[120%] md:translate-y-0
        flex flex-col overflow-hidden">
        
        <!-- Header Image Area (Foto Pemandangan Dinamis) -->
        <div class="relative h-40 md:h-48 w-full bg-slate-200 shrink-0">
            <img id="prov-image" src="" alt="Pemandangan Wilayah" class="w-full h-full object-cover">
            <button id="close-panel" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm hover:bg-black/60 transition-colors">
                <span class="material-symbols-rounded text-sm">close</span>
            </button>
            <!-- Badge Tipe Administratif (misal: Kelurahan/Kecamatan) -->
            <div id="admin-badge" class="absolute bottom-4 left-4 bg-black/60 backdrop-blur-md text-white text-xs font-medium px-2 py-1 rounded-md">
                Wilayah
            </div>
        </div>

        <!-- Area Konten Detail -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-5 pb-8">
            <h1 id="prov-name" class="text-2xl font-normal text-slate-900 mb-1 leading-tight">Nama Lokasi</h1>
            <p id="prov-address" class="text-sm text-slate-500 mb-4 border-b border-slate-100 pb-4 leading-relaxed">Alamat Lengkap</p>

            <div class="flex justify-around mb-6 border-b border-slate-100 pb-6">
                <button class="flex flex-col items-center gap-1.5 text-google-blue hover:text-blue-800 transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-blue-50 group-hover:bg-blue-100 flex items-center justify-center">
                        <span class="material-symbols-rounded icon-filled">directions</span>
                    </div>
                    <span class="text-[11px] font-medium">Rute</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 text-google-blue hover:text-blue-800 transition-colors group">
                    <div class="w-10 h-10 rounded-full border border-slate-200 group-hover:bg-slate-50 flex items-center justify-center">
                        <span class="material-symbols-rounded">bookmark</span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-700">Simpan</span>
                </button>
                <button class="flex flex-col items-center gap-1.5 text-google-blue hover:text-blue-800 transition-colors group">
                    <div class="w-10 h-10 rounded-full border border-slate-200 group-hover:bg-slate-50 flex items-center justify-center">
                        <span class="material-symbols-rounded">share</span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-700">Bagikan</span>
                </button>
            </div>

            <!-- Informasi Tambahan -->
            <div class="space-y-4">
                <div class="flex items-start gap-4">
                    <span class="material-symbols-rounded text-slate-400 mt-0.5">map</span>
                    <div>
                        <p class="text-[13px] text-slate-500 font-medium">Koordinat Pusat</p>
                        <p id="prov-coord" class="text-[14px] text-slate-800 mt-0.5 font-mono">-</p>
                    </div>
                </div>
                <div class="flex items-start gap-4 pt-2">
                    <span class="material-symbols-rounded text-slate-400 mt-0.5">info</span>
                    <div>
                        <p class="text-[13px] text-slate-600 leading-relaxed">
                            Batas wilayah (poligon) didapatkan secara dinamis dari OpenStreetMap berdasarkan pencarian Anda.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Grup Tombol Aksi (Kanan Bawah) -->
    <div class="absolute bottom-6 right-4 z-[1000] flex flex-col gap-3">
        <button id="toggle-layer" class="w-12 h-12 bg-white rounded-lg shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex flex-col items-center justify-center hover:bg-slate-50 transition-colors group overflow-hidden relative" title="Ganti Tipe Peta">
            <img id="layer-thumbnail" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/4/8/12" class="absolute inset-0 w-full h-full object-cover opacity-80" alt="Layer">
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors"></div>
            <span class="material-symbols-rounded text-white z-10 drop-shadow-md">layers</span>
        </button>

        <button id="reset-map" class="w-12 h-12 bg-white rounded-full shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex items-center justify-center text-slate-600 hover:text-google-blue hover:bg-slate-50 transition-colors" title="Kembali ke Tampilan Indonesia">
            <span class="material-symbols-rounded icon-filled">my_location</span>
        </button>

        <div class="bg-white rounded-lg shadow-[0_2px_6px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden">
            <button id="zoom-in" class="w-12 h-12 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors border-b border-slate-200">
                <span class="material-symbols-rounded">add</span>
            </button>
            <button id="zoom-out" class="w-12 h-12 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors">
                <span class="material-symbols-rounded">remove</span>
            </button>
        </div>
    </div>

    <!-- Memuat Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        // --- 1. Konfigurasi Awal Peta ---
        const isMobile = window.innerWidth < 768;
        const initialCenter = [-2.5, 118.0]; // Titik tengah Indonesia
        const initialZoom = isMobile ? 4.5 : 5.5;

        const map = L.map('map', {
            zoomControl: false,
            minZoom: 4,
            maxZoom: 18, // Ditingkatkan agar bisa zoom dekat ke level kelurahan
            zoomAnimation: true
        }).setView(initialCenter, initialZoom);

        // Peta Dasar
        const streetLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        streetLayer.addTo(map);
        let currentLayer = 'street';

        // --- 2. Variabel State Global ---
        let baseProvinceLayer = null; // Menyimpan layer statis provinsi awal
        let activeSearchLayer = null; // Menyimpan polygon batas wilayah hasil pencarian (Kecamatan/Kelurahan)
        let activeMarker = null; // Pin merah

        const infoPanel = document.getElementById('info-panel');
        const searchInput = document.getElementById('search-input');
        const searchResultsContainer = document.getElementById('search-results');
        const searchIcon = document.getElementById('search-icon');
        const searchLoader = document.getElementById('search-loader');
        const clearSearchBtn = document.getElementById('clear-search');

        // --- 3. Fungsi Panel UI ---
        function openPanel(data) {
            // Parsing data dari Nominatim API OpenStreetMap
            const name = data.name || data.display_name.split(',')[0];
            const fullName = data.display_name;
            const lat = parseFloat(data.lat).toFixed(5);
            const lon = parseFloat(data.lon).toFixed(5);
            const type = data.addresstype || data.type || "Wilayah";

            document.getElementById('prov-name').innerText = name;
            document.getElementById('prov-address').innerText = fullName;
            document.getElementById('prov-coord').innerText = `${lat}, ${lon}`;
            
            // Format Badge (Kapitalisasi huruf pertama)
            const typeFormatted = type.charAt(0).toUpperCase() + type.slice(1);
            document.getElementById('admin-badge').innerText = typeFormatted;

            // Gambar acak berdasarkan hash nama untuk mempercantik UI
            const hash = Array.from(name).reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const imgIds = ["1584314417721-a3f295b9d3e8", "1512100253150-128c77229e61", "1576402758129-8f430485600c", "1620023605206-8c4d2847fc72", "1537996194471-e657df975ab4", "1555899434-112347314545"];
            const imgUrl = `https://images.unsplash.com/photo-${imgIds[hash % imgIds.length]}?auto=format&fit=crop&w=600&q=80`;
            document.getElementById('prov-image').src = imgUrl;

            // Animasi masuk
            if (isMobile) {
                infoPanel.classList.remove('translate-y-full');
                infoPanel.classList.add('translate-y-0');
            } else {
                infoPanel.classList.remove('md:-translate-x-[120%]');
                infoPanel.classList.add('md:translate-x-0');
            }
        }

        function closePanel() {
            if (isMobile) {
                infoPanel.classList.remove('translate-y-0');
                infoPanel.classList.add('translate-y-full');
            } else {
                infoPanel.classList.remove('md:translate-x-0');
                infoPanel.classList.add('md:-translate-x-[120%]');
            }
            
            // Jangan hapus marker dan poly saat tutup panel agar user masih bisa lihat di peta
            // Mereka akan dihapus saat reset peta atau pencarian baru
        }
        document.getElementById('close-panel').addEventListener('click', closePanel);

        // --- 4. Logika Pencarian (Geocoding dengan OSM Nominatim) ---
        let searchTimeout = null;

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            
            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
                searchResultsContainer.classList.add('hidden');
                searchResultsContainer.innerHTML = '';
            }

            // Debounce: Tunggu user selesai mengetik agar tidak spam API
            clearTimeout(searchTimeout);
            if (query.length > 2) {
                searchTimeout = setTimeout(() => {
                    performSearch(query);
                }, 800);
            }
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            searchResultsContainer.classList.add('hidden');
            searchResultsContainer.innerHTML = '';
            searchInput.focus();
        });

        async function performSearch(query) {
            // Tampilkan animasi loading
            searchIcon.style.display = 'none';
            searchLoader.style.display = 'block';
            
            try {
                // Endpoint Nominatim: Batasi negara ID, ambil poligon (geojson=1)
                const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&countrycodes=id&format=json&polygon_geojson=1&limit=5`;
                const response = await fetch(url, {
                    headers: { 'Accept-Language': 'id' } // Paksa respon bahasa Indonesia
                });
                
                const results = await response.json();
                renderSearchResults(results);
            } catch (error) {
                console.error("Gagal melakukan pencarian:", error);
                renderSearchError();
            } finally {
                searchIcon.style.display = 'block';
                searchLoader.style.display = 'none';
            }
        }

        function renderSearchResults(results) {
            searchResultsContainer.innerHTML = '';
            
            if (results.length === 0) {
                searchResultsContainer.innerHTML = `
                    <div class="px-4 py-3 text-sm text-slate-500 text-center">
                        Lokasi tidak ditemukan. Coba nama yang lebih spesifik (misal: "Kelurahan Menteng").
                    </div>
                `;
                searchResultsContainer.classList.remove('hidden');
                return;
            }

            results.forEach(item => {
                // Pisahkan nama utama dan konteks alamat
                const parts = item.display_name.split(', ');
                const mainName = item.name || parts[0];
                const contextName = parts.slice(1).join(', ');
                
                // Ikon berdasarkan tipe (administrative, city, dll)
                let iconName = 'location_on';
                if (item.class === 'boundary' || item.type === 'administrative') iconName = 'map';
                if (item.type === 'city' || item.type === 'town') iconName = 'location_city';

                const div = document.createElement('div');
                div.className = "px-4 py-3 hover:bg-slate-50 cursor-pointer flex items-start gap-3 border-b border-slate-50 last:border-none transition-colors";
                div.innerHTML = `
                    <span class="material-symbols-rounded text-slate-400 text-[20px] mt-0.5">${iconName}</span>
                    <div class="flex-1 min-w-0">
                        <p class="text-[14px] font-medium text-slate-800 truncate">${mainName}</p>
                        <p class="text-[12px] text-slate-500 truncate mt-0.5">${contextName}</p>
                    </div>
                `;
                
                // Event saat hasil pencarian diklik
                div.addEventListener('click', () => {
                    searchResultsContainer.classList.add('hidden');
                    searchInput.value = mainName;
                    drawBoundaryAndFly(item);
                });
                
                searchResultsContainer.appendChild(div);
            });
            
            searchResultsContainer.classList.remove('hidden');
        }

        function renderSearchError() {
            searchResultsContainer.innerHTML = `
                <div class="px-4 py-3 text-sm text-red-500 text-center">
                    Terjadi kesalahan jaringan saat mencari lokasi.
                </div>
            `;
            searchResultsContainer.classList.remove('hidden');
        }

        // --- 5. Fungsi Render Peta (Boundary & Marker) ---
        function drawBoundaryAndFly(item) {
            // Hapus hasil pencarian sebelumnya
            if (activeSearchLayer) map.removeLayer(activeSearchLayer);
            if (activeMarker) map.removeLayer(activeMarker);

            // Jika item memiliki GeoJSON (poligon batas wilayah/kelurahan/kecamatan)
            if (item.geojson && (item.geojson.type === 'Polygon' || item.geojson.type === 'MultiPolygon')) {
                activeSearchLayer = L.geoJSON(item.geojson, {
                    style: {
                        color: '#1a73e8', // Biru Google Maps
                        weight: 3,
                        opacity: 0.8,
                        fillColor: '#1a73e8',
                        fillOpacity: 0.15
                    }
                }).addTo(map);

                // Dapatkan bounds (kotak batas) dari poligon untuk di zoom
                const bounds = activeSearchLayer.getBounds();
                map.flyToBounds(bounds, {
                    paddingTopLeft: [isMobile ? 10 : 420, isMobile ? 10 : 20],
                    paddingBottomRight: [isMobile ? 10 : 20, isMobile ? window.innerHeight * 0.6 : 20],
                    duration: 1.5
                });
                
                // Taruh pin di tengah poligon
                placeCustomPin(bounds.getCenter());
            } else {
                // Jika tidak ada batas wilayah, sekadar terbang ke titik koordinatnya
                const lat = parseFloat(item.lat);
                const lon = parseFloat(item.lon);
                map.flyTo([lat, lon], 14, { duration: 1.5 });
                placeCustomPin([lat, lon]);
            }

            // Buka panel info
            openPanel(item);
        }

        function placeCustomPin(latlng) {
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<span class="material-symbols-rounded icon-filled text-[40px] text-red-600 drop-shadow-md" style="text-shadow: 0 4px 6px rgba(0,0,0,0.3);">location_on</span>`,
                iconSize: [40, 40],
                iconAnchor: [20, 40]
            });

            setTimeout(() => {
                activeMarker = L.marker(latlng, { icon: customIcon }).addTo(map);
            }, 500); // Delay sedikit agar barengan dengan animasi terbang
        }

        // --- 6. Event Listener Tombol Peta ---
        document.getElementById('zoom-in').addEventListener('click', () => map.zoomIn());
        document.getElementById('zoom-out').addEventListener('click', () => map.zoomOut());
        
        document.getElementById('reset-map').addEventListener('click', () => {
            closePanel();
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            
            // Hapus layer pencarian
            if (activeSearchLayer) map.removeLayer(activeSearchLayer);
            if (activeMarker) map.removeLayer(activeMarker);
            
            // Terbang kembali ke titik tengah Indonesia
            map.flyTo(initialCenter, initialZoom, { duration: 1.5 });
        });

        // Toggle Layer (Satelit vs Jalan)
        document.getElementById('toggle-layer').addEventListener('click', () => {
            const layerThumbnail = document.getElementById('layer-thumbnail');
            if (currentLayer === 'street') {
                map.removeLayer(streetLayer);
                satelliteLayer.addTo(map);
                currentLayer = 'satellite';
                layerThumbnail.src = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/4/8/12";
                
                // Jika ada batas wilayah aktif, beri border putih agar kontras di peta satelit gelap
                if (activeSearchLayer) {
                    activeSearchLayer.setStyle({ color: '#ffffff' });
                }
            } else {
                map.removeLayer(satelliteLayer);
                streetLayer.addTo(map);
                currentLayer = 'street';
                layerThumbnail.src = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/4/8/12";
                
                if (activeSearchLayer) {
                    activeSearchLayer.setStyle({ color: '#1a73e8' });
                }
            }
        });

        // Tutup hasil pencarian jika klik area kosong di peta
        map.on('click', function() {
            searchResultsContainer.classList.add('hidden');
        });

        // Sembunyikan layer provinsi awal secara bawaan agar peta bersih,
        // namun bisa diaktifkan jika diperlukan fitur on-hover seluruh provinsi.
        // Karena fokus sekarang adalah pencarian mendalam, UI bersih ala Google Maps lebih cocok.
    </script>
</body>
</html>
